<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Algorithms Practice Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#182334;font:16px system-ui,sans-serif}header{max-width:1150px;margin:36px auto 0;padding:20px;background:white;border:1px solid #dbe2ea;border-radius:16px}header strong{font-size:1.5rem}header p{margin:6px 0;color:#526477;font-size:14px}nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}nav a{color:#182334;text-decoration:none;background:#e7edf6;padding:10px 14px;border-radius:8px}nav a[aria-current="page"]{background:#d5dde8;color:#182334}#pages iframe{border:0;width:100%;max-width:1190px;height:calc(100dvh - 230px);min-height:500px;margin:0 auto;display:block}#pages iframe[hidden]{display:none}@media(max-width:600px){header{margin:20px 12px 0;padding:14px}nav{gap:8px}nav a{padding:9px 11px}#pages iframe{height:calc(100dvh - 210px)}}</style></head><body><header><strong>Algorithms Practice Lab</strong><p>Select an algorithm. Your progress stays available when switching pages.</p><nav aria-label="Algorithms"><a href="#red-black">Red-black tree</a><a href="#heaps">Min / max heaps</a><a href="#radix">Radix sort - two passes</a><a href="#bucket">Bucket sort</a><a href="#asymptotic">O / Omega / Theta analysis</a></nav></header><div id="pages"></div><script>(function(){const descriptor=Object.getOwnPropertyDescriptor(HTMLIFrameElement.prototype,'srcdoc');Object.defineProperty(HTMLIFrameElement.prototype,'srcdoc',{get:descriptor.get,set(value){descriptor.set.call(this,enhance(value));}});function enhance(html){html=html.replace('</style>','button{background:#e7edf6;color:#182334}</style>');const isTree=html.includes('aria-label="Red-black tree"')||html.includes('aria-label="Binary heap"');if(isTree)html=html.replace('</style>','#canvas svg{transform:scale(.7);transform-origin:top center}</style>');if(html.includes('aria-label="Binary heap"')){html=html.replace('insert(value){this.a.push(value);',"insert(value){if(this.a.includes(value)){this.snapshot(value+' already exists; duplicates are ignored.');return;}this.a.push(value);");html=html.replace('Duplicates are allowed. Delete value removes the first matching value in array order.','Duplicate values are ignored. Delete value removes the matching value from the heap.');}const setup=`<script>(function(){function wrap(buttonId,inputId,shouldClear){const button=document.getElementById(buttonId),input=document.getElementById(inputId);if(!button||!input||typeof button.onclick!=='function')return;const original=button.onclick;button.onclick=function(event){const clear=shouldClear(input.value);original.call(this,event);if(clear)input.value='';};}const number=value=>value.trim()!==''&&Number.isSafeInteger(Number(value));if(document.getElementById('tree'))for(const id of ['insert','remove','find'])wrap(id,'value',number);for(const id of ['radix','bucket']){const start=document.getElementById('start');if(start){const original=start.onclick,input=document.getElementById('values'),error=document.getElementById('error');start.onclick=function(event){const entered=input.value.trim()!=='';original.call(this,event);if(entered&&!error.textContent)input.value='';};}}const analyse=document.getElementById('analyse'),expressions=document.getElementById('expressions');if(analyse&&expressions){const original=analyse.onclick;analyse.onclick=function(event){const clear=expressions.value.trim()!==''&&expressions.value.split(String.fromCharCode(10)).filter(line=>line.trim()).length<=50;original.call(this,event);if(clear)expressions.value='';};}})();`+'<'+'/script>';return html.includes('</body>')?html.replace('</body>',setup+'</body>'):html.replace('</html>',setup+'</html>');}})();</script><script>
const sources={"red-black": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>Red\u2013Black Tree Lab\u003c/title>\n\u003cstyle>\n*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#182334;font:16px system-ui,sans-serif}main{max-width:1150px;margin:36px auto;padding:0 20px}h1{margin-bottom:6px}p{line-height:1.6}.card{background:white;border:1px solid #dbe2ea;border-radius:16px;padding:20px;margin:18px 0}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input{padding:11px;width:150px;border:1px solid #aab8ca;border-radius:8px}button{padding:11px 16px;border:0;border-radius:8px;background:#2456be;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:default}.secondary{background:#e7edf6;color:#182334}#canvas{overflow:auto}svg{display:block;min-width:100%;height:auto}#message{min-height:28px;font-weight:600}li{padding:5px}label{display:flex;align-items:center;gap:8px}label input{width:auto}.muted{color:#526477;font-size:14px}#steps{max-height:280px;overflow:auto}#status{color:#247447}a{color:#2456be}code{background:#eef2f6;padding:2px 5px}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\n\u003ch1>Red\u2013Black Tree Lab\u003c/h1>\u003cp>Insert, delete, and find values. Review each rotation and recolouring with the step buttons.\u003c/p>\n\u003csection class=\"card controls\">\u003clabel for=\"value\">Value\u003c/label>\u003cinput id=\"value\" type=\"number\" step=\"1\" placeholder=\"e.g. 25\">\u003cbutton id=\"insert\">Insert\u003c/button>\u003cbutton id=\"remove\">Delete\u003c/button>\u003cbutton id=\"find\">Find\u003c/button>\u003cbutton id=\"print\" class=\"secondary\">Print sorted\u003c/button>\u003cbutton id=\"example\" class=\"secondary\">Load example\u003c/button>\u003cbutton id=\"reset\" class=\"secondary\">Reset\u003c/button>\u003c/section>\n\u003csection class=\"card\">\u003cdiv class=\"controls\">\u003cbutton id=\"prev\" class=\"secondary\">\u2190 Previous step\u003c/button>\u003cbutton id=\"next\" class=\"secondary\">Next step \u2192\u003c/button>\u003cspan id=\"counter\">\u003c/span>\u003clabel>\u003cinput id=\"nil\" type=\"checkbox\">Show NIL leaves\u003c/label>\u003c/div>\u003cp id=\"message\" aria-live=\"polite\">\u003c/p>\u003cdiv id=\"canvas\">\u003csvg id=\"tree\" role=\"img\" aria-label=\"Red-black tree\">\u003c/svg>\u003c/div>\u003cp id=\"status\">\u003c/p>\u003cp id=\"sorted\" class=\"muted\">\u003c/p>\u003c/section>\n\u003csection class=\"card\">\u003ch2>Operation steps\u003c/h2>\u003col id=\"steps\">\u003c/ol>\u003c/section>\n\u003cdetails class=\"card\">\u003csummary>Rules and source code\u003c/summary>\u003cul>\u003cli>The root and all NIL leaves are black.\u003c/li>\u003cli>A red node has no red children.\u003c/li>\u003cli>Every path from a node to a NIL leaf contains the same number of black nodes.\u003c/li>\u003cli>Smaller values go left; larger values go right. Duplicate values are ignored.\u003c/li>\u003c/ul>\u003cp>Red nodes include an R label; black nodes include a B label. Insert, delete, and find take O(log n); drawing and recording the tree take O(n) per snapshot. Case numbering varies between textbooks, so explanations describe the actual case.\u003c/p>\u003cp>This is an original, dependency-free implementation. Edit this \u003ccode>index.html\u003c/code> to customise your page.\u003c/p>\u003c/details>\n\u003c/main>\u003cscript>\n'use strict';\n// One shared black sentinel represents all missing children.\nclass RBTree {\n constructor(record=()=>{}){this.nil={color:'B',key:null};this.nil.left=this.nil.right=this.nil.parent=this.nil;this.root=this.nil;this.record=record;}\n snapshot(message,highlight=null){const copy=n=>n===this.nil?null:{key:n.key,color:n.color,left:copy(n.left),right:copy(n.right)};this.record({message,highlight,root:copy(this.root)});}\n find(key){let n=this.root;while(n!==this.nil&&n.key!==key)n=key\u003cn.key?n.left:n.right;return n;}\n leftRotate(x){let y=x.right;x.right=y.left;if(y.left!==this.nil)y.left.parent=x;y.parent=x.parent;if(x.parent===this.nil)this.root=y;else if(x===x.parent.left)x.parent.left=y;else x.parent.right=y;y.left=x;x.parent=y;this.snapshot(`Rotate left at ${x.key}.`);}\n rightRotate(x){let y=x.left;x.left=y.right;if(y.right!==this.nil)y.right.parent=x;y.parent=x.parent;if(x.parent===this.nil)this.root=y;else if(x===x.parent.right)x.parent.right=y;else x.parent.left=y;y.right=x;x.parent=y;this.snapshot(`Rotate right at ${x.key}.`);}\n insert(key){if(this.find(key)!==this.nil){this.snapshot(`${key} already exists; duplicates are ignored.`,key);return;}let p=this.nil,n=this.root;while(n!==this.nil){p=n;n=key\u003cn.key?n.left:n.right;}let z={key,color:'R',left:this.nil,right:this.nil,parent:p};if(p===this.nil)this.root=z;else if(key\u003cp.key)p.left=z;else p.right=z;this.snapshot(`Insert ${key} as a red leaf.`,key);\n while(z.parent.color==='R'){let p=z.parent,g=p.parent;let left=p===g.left,u=left?g.right:g.left;if(u.color==='R'){p.color=u.color='B';g.color='R';this.snapshot(`Red uncle: colour parent ${p.key} and uncle ${u.key} black; grandparent ${g.key} red.`);z=g;}else{if(z===(left?p.right:p.left)){z=p;left?this.leftRotate(z):this.rightRotate(z);}z.parent.color='B';z.parent.parent.color='R';this.snapshot('Black uncle: colour parent black and grandparent red.');left?this.rightRotate(z.parent.parent):this.leftRotate(z.parent.parent);}}\n this.root.color='B';this.snapshot(`Insertion complete. Root is black.`,key);}\n transplant(u,v){if(u.parent===this.nil)this.root=v;else if(u===u.parent.left)u.parent.left=v;else u.parent.right=v;v.parent=u.parent;}\n remove(key){let z=this.find(key);if(z===this.nil){this.snapshot(`${key} is not in the tree.`);return;}let y=z,old=y.color,x;if(z.left===this.nil){x=z.right;this.transplant(z,z.right);}else if(z.right===this.nil){x=z.left;this.transplant(z,z.left);}else{y=z.right;while(y.left!==this.nil)y=y.left;old=y.color;x=y.right;if(y.parent===z)x.parent=y;else{this.transplant(y,y.right);y.right=z.right;y.right.parent=y;}this.transplant(z,y);y.left=z.left;y.left.parent=y;y.color=z.color;}\n this.snapshot(`Remove ${key}${y!==z?`; replace it with successor ${y.key}`:''}.`);if(old==='B')this.fixDelete(x);this.nil.color='B';if(this.root!==this.nil)this.root.parent=this.nil;this.snapshot(`Deletion complete.`,null);}\n fixDelete(x){while(x!==this.root&&x.color==='B'){let left=x===x.parent.left,w=left?x.parent.right:x.parent.left;if(w.color==='R'){w.color='B';x.parent.color='R';this.snapshot('Red sibling: recolour sibling black and parent red.');left?this.leftRotate(x.parent):this.rightRotate(x.parent);w=left?x.parent.right:x.parent.left;}let near=left?w.left:w.right,far=left?w.right:w.left;if(near.color==='B'&&far.color==='B'){if(w!==this.nil)w.color='R';this.snapshot('Black sibling with two black children: recolour sibling red and move the extra black upward.');x=x.parent;}else{if(far.color==='B'){near.color='B';w.color='R';this.snapshot('Near child red, far child black: recolour and rotate sibling.');left?this.rightRotate(w):this.leftRotate(w);w=left?x.parent.right:x.parent.left;}w.color=x.parent.color;x.parent.color='B';(left?w.right:w.left).color='B';this.snapshot('Far child red: transfer parent colour to sibling; colour parent and far child black.');left?this.leftRotate(x.parent):this.rightRotate(x.parent);x=this.root;}}\n x.color='B';}\n values(){let result=[];const walk=n=>{if(n===this.nil)return;walk(n.left);result.push(n.key);walk(n.right);};walk(this.root);return result;}\n validate(){if(this.nil.color!=='B'||this.root.color!=='B')throw Error('Root or NIL is red');const walk=(n,lo,hi)=>{if(n===this.nil)return 1;if(!(n.key>lo&&n.key\u003chi))throw Error('BST order');if(n.color==='R'&&(n.left.color==='R'||n.right.color==='R'))throw Error('Red violation');if(n.left!==this.nil&&n.left.parent!==n||n.right!==this.nil&&n.right.parent!==n)throw Error('Parent link');let l=walk(n.left,lo,n.key),r=walk(n.right,n.key,hi);if(l!==r)throw Error('Black height');return l+(n.color==='B');};return walk(this.root,-Infinity,Infinity);}\n}\nconst $=id=>document.getElementById(id);let frames=[],position=0;let tree=new RBTree(f=>frames.push(f));\nfunction draw(){const f=frames[position];if(!f)return;const svg=$('tree');svg.replaceChildren();let nodes=[],edges=[],i=0,maxDepth=0;const layout=(n,depth)=>{if(!n&&!$('nil').checked)return null;let left=n?layout(n.left,depth+1):null;let item={n,x:55+85*i++,y:50+90*depth};nodes.push(item);maxDepth=Math.max(maxDepth,depth);let right=n?layout(n.right,depth+1):null;for(let c of [left,right])if(c)edges.push([item,c]);return item;};layout(f.root,0);let width=Math.max(700,i*85+30),height=Math.max(240,maxDepth*90+105);svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.style.width=width+'px';const el=(tag,attrs,text)=>{let e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(let [k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;};for(let [a,b]of edges)el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#9baac0','stroke-width':2});for(let {n,x,y}of nodes){el('circle',{cx:x,cy:y,r:n?25:15,fill:n?.color==='R'?'#c82d46':'#202c3f',stroke:n&&n.key===f.highlight?'#f5af16':'white','stroke-width':n&&n.key===f.highlight?5:2});el('text',{x,y:y+5,'text-anchor':'middle',fill:'white','font-size':n?14:10},n?n.key:'NIL');if(n)el('text',{x,y:y+43,'text-anchor':'middle',fill:'#526477','font-size':12},n.color);}\n if(!f.root&&!$('nil').checked)el('text',{x:350,y:110,'text-anchor':'middle',fill:'#526477'},'Tree is empty');$('message').textContent=f.message;$('counter').textContent=`Step ${position+1} of ${frames.length}`;$('prev').disabled=position===0;$('next').disabled=position===frames.length-1;$('status').textContent=position===frames.length-1?'\u2713 Final tree satisfies all red\u2013black rules.':'Intermediate repair step \u2014 rules may temporarily be violated.';$('steps').replaceChildren(...frames.map((s,j)=>{let li=document.createElement('li');li.textContent=s.message;li.style.fontWeight=j===position?'700':'400';return li;}));}\nfunction operation(action){frames=[];$('sorted').textContent='';action();tree.validate();position=frames.length-1;draw();}\nfunction value(){let s=$('value').value.trim(),n=Number(s);if(!s||!Number.isSafeInteger(n)){alert('Enter a safe whole number.');return null;}return n;}\n$('insert').onclick=()=>{let n=value();if(n!==null)operation(()=>tree.insert(n));};$('remove').onclick=()=>{let n=value();if(n!==null)operation(()=>tree.remove(n));};$('find').onclick=()=>{let key=value();if(key===null)return;operation(()=>{let n=tree.root;while(n!==tree.nil){tree.snapshot(`Compare ${key} with ${n.key}.`,n.key);if(key===n.key){tree.snapshot(`Found ${key}.`,key);return;}n=key\u003cn.key?n.left:n.right;}tree.snapshot(`${key} is not in the tree.`);});};$('print').onclick=()=>{$('sorted').textContent='Sorted values: '+(tree.values().join(', ')||'(empty)');};$('reset').onclick=()=>operation(()=>{tree=new RBTree(f=>frames.push(f));tree.snapshot('Tree reset.');});$('example').onclick=()=>operation(()=>{tree=new RBTree(f=>frames.push(f));for(let n of [40,20,60,10,30,50,70,25])tree.insert(n);tree.snapshot('Example loaded. Try inserting 27 or deleting 20.');});$('prev').onclick=()=>{position--;draw();};$('next').onclick=()=>{position++;draw();};$('nil').onchange=draw;$('value').onkeydown=e=>{if(e.key==='Enter')$('insert').click();};tree.snapshot('Enter a number to begin.');draw();\n\u003c/script>\u003c/body>\u003c/html>\n", "heaps": "\u003c!DOCTYPE html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Min & Max Heap Lab\u003c/title>\u003cstyle>\n*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#182334;font:16px system-ui,sans-serif}main{max-width:1150px;margin:36px auto;padding:0 20px}h1{margin-bottom:6px}p{line-height:1.6}.card{background:white;border:1px solid #dbe2ea;border-radius:16px;padding:20px;margin:18px 0}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,select{padding:11px;border:1px solid #aab8ca;border-radius:8px;font:inherit}input{width:150px}button{padding:11px 16px;border:0;border-radius:8px;background:#2456be;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:default}.secondary{background:#e7edf6;color:#182334}#canvas{overflow:auto}svg{display:block;min-width:100%;height:auto}#message{min-height:28px;font-weight:600}li{padding:5px}.muted{color:#526477;font-size:14px}#steps{max-height:280px;overflow:auto}#status{color:#247447}#array{display:flex;gap:6px;overflow:auto;padding:6px 0}.cell{min-width:58px;border:2px solid #dbe2ea;border-radius:8px;text-align:center;padding:9px}.cell.active{border-color:#e59a00;background:#fff6d8}.index{font-size:12px;color:#526477;margin-top:5px}code{background:#eef2f6;padding:2px 5px}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003ch1>Min & Max Heap Lab\u003c/h1>\u003cp>Explore insertion and deletion in a binary heap. Step through comparisons and swaps in both the tree and its array.\u003c/p>\n\u003csection class=\"card controls\">\u003clabel for=\"mode\">Heap type\u003c/label>\u003cselect id=\"mode\">\u003coption value=\"min\">Min heap\u003c/option>\u003coption value=\"max\">Max heap\u003c/option>\u003c/select>\u003clabel for=\"value\">Value\u003c/label>\u003cinput id=\"value\" type=\"number\" step=\"1\" placeholder=\"e.g. 25\">\u003cbutton id=\"insert\">Insert\u003c/button>\u003cbutton id=\"root\">Delete root\u003c/button>\u003cbutton id=\"remove\">Delete value\u003c/button>\u003cbutton id=\"find\" class=\"secondary\">Find\u003c/button>\u003cbutton id=\"example\" class=\"secondary\">Load example\u003c/button>\u003cbutton id=\"reset\" class=\"secondary\">Reset\u003c/button>\u003c/section>\n\u003csection class=\"card\">\u003cdiv class=\"controls\">\u003cbutton id=\"prev\" class=\"secondary\">\u2190 Previous step\u003c/button>\u003cbutton id=\"next\" class=\"secondary\">Next step \u2192\u003c/button>\u003cspan id=\"counter\">\u003c/span>\u003c/div>\u003cp id=\"message\" aria-live=\"polite\">\u003c/p>\u003cdiv id=\"canvas\">\u003csvg id=\"tree\" role=\"img\" aria-label=\"Binary heap\">\u003c/svg>\u003c/div>\u003ch3>Array representation\u003c/h3>\u003cdiv id=\"array\">\u003c/div>\u003cp class=\"muted\">Indices start at 0. Parent: floor((i \u2212 1) / 2). Left child: 2i + 1. Right child: 2i + 2.\u003c/p>\u003cp id=\"status\">\u003c/p>\u003c/section>\n\u003csection class=\"card\">\u003ch2>Operation steps\u003c/h2>\u003col id=\"steps\">\u003c/ol>\u003c/section>\u003cdetails class=\"card\">\u003csummary>Heap rules and complexity\u003c/summary>\u003cul>\u003cli>A heap is a complete binary tree: levels fill from left to right.\u003c/li>\u003cli>Min heap: every parent is less than or equal to its children; the root is the minimum.\u003c/li>\u003cli>Max heap: every parent is greater than or equal to its children; the root is the maximum.\u003c/li>\u003cli>Duplicates are allowed. Delete value removes the first matching value in array order.\u003c/li>\u003cli>Insertion and root deletion: O(log n). Finding or deleting a value by searching: O(n).\u003c/li>\u003cli>Switching heap type rebuilds the current values in O(n) algorithm time. Visual snapshots add O(n) work per step.\u003c/li>\u003c/ul>\u003cp>The array is not necessarily sorted. A heap orders parents relative to children.\u003c/p>\u003cp>This original page needs no libraries or server. Upload this file as \u003ccode>index.html\u003c/code> to GitHub Pages.\u003c/p>\u003c/details>\u003c/main>\u003cscript>\n'use strict';\nclass Heap {\n constructor(mode='min',record=()=>{}){this.a=[];this.mode=mode;this.record=record;}\n better(a,b){return this.mode==='min'?a\u003cb:a>b;}\n snapshot(message,active=[]){this.record({message,active:[...active],a:[...this.a],mode:this.mode});}\n swap(i,j){let before=[this.a[i],this.a[j]];[this.a[i],this.a[j]]=[this.a[j],this.a[i]];this.snapshot(`Swap ${before[0]} at index ${i} with ${before[1]} at index ${j}.`,[i,j]);}\n up(i){while(i>0){let p=Math.floor((i-1)/2);this.snapshot(`Compare ${this.a[i]} with parent ${this.a[p]}.`,[i,p]);if(!this.better(this.a[i],this.a[p])){this.snapshot('Parent order is correct; stop sifting up.',[i,p]);break;}this.swap(i,p);i=p;}}\n down(i){while(2*i+1\u003cthis.a.length){let l=2*i+1,r=l+1,c=l;if(r\u003cthis.a.length){this.snapshot(`Compare children ${this.a[l]} and ${this.a[r]}; choose the ${this.mode==='min'?'smaller':'larger'} child.`,[l,r]);if(this.better(this.a[r],this.a[l]))c=r;}this.snapshot(`Compare parent ${this.a[i]} with child ${this.a[c]}.`,[i,c]);if(!this.better(this.a[c],this.a[i])){this.snapshot('Parent order is correct; stop sifting down.',[i,c]);break;}this.swap(i,c);i=c;}}\n insert(value){this.a.push(value);this.snapshot(`Append ${value} at index ${this.a.length-1} to keep the tree complete.`,[this.a.length-1]);this.up(this.a.length-1);this.snapshot(`Insertion complete: root is ${this.a[0]}.`);}\n removeAt(i){if(i\u003c0||i>=this.a.length){this.snapshot('Heap is empty; there is nothing to delete.');return;}const removed=this.a[i],last=this.a.pop();if(i\u003cthis.a.length){this.a[i]=last;this.snapshot(`Delete ${removed}; move the last value ${last} into index ${i}.`,[i]);if(i>0&&this.better(this.a[i],this.a[Math.floor((i-1)/2)])){this.snapshot('Replacement belongs above its parent; sift up.',[i]);this.up(i);}else{this.snapshot('Check replacement against its children; sift down.',[i]);this.down(i);}}else this.snapshot(`Delete ${removed}, the last array entry.`);this.snapshot(`Deletion complete.${this.a.length?' Root is '+this.a[0]+'.':' Heap is empty.'}`);return removed;}\n removeValue(value){const i=this.a.indexOf(value);if(i===-1){this.snapshot(`${value} is not in the heap.`);return;}this.snapshot(`Find ${value} at index ${i}.`,[i]);return this.removeAt(i);}\n rebuild(mode){this.mode=mode;this.snapshot(`Switch to ${mode} heap. Rebuild from the last parent upward.`);for(let i=Math.floor(this.a.length/2)-1;i>=0;i--){this.snapshot(`Sift down from index ${i}.`,[i]);this.down(i);}this.snapshot(`${mode==='min'?'Min':'Max'} heap rebuilt.`);}\n validate(){for(let i=1;i\u003cthis.a.length;i++)if(this.better(this.a[i],this.a[Math.floor((i-1)/2)]))throw Error('Heap order violated');}\n}\nconst $=id=>document.getElementById(id);let frames=[],position=0;let heap=new Heap('min',f=>frames.push(f));\nfunction draw(){const f=frames[position];if(!f)return;const svg=$('tree');svg.replaceChildren();const depth=f.a.length?Math.floor(Math.log2(f.a.length)):0,width=Math.max(700,Math.pow(2,depth)*75),height=Math.max(220,depth*95+115);svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.style.width=width+'px';const point=i=>{let d=Math.floor(Math.log2(i+1)),k=i-(Math.pow(2,d)-1);return {x:width*(k+.5)/Math.pow(2,d),y:50+d*95};};const el=(tag,attrs,text)=>{let e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;svg.appendChild(e);};for(let i=1;i\u003cf.a.length;i++){let a=point(Math.floor((i-1)/2)),b=point(i);el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#9baac0','stroke-width':2});}f.a.forEach((n,i)=>{let {x,y}=point(i);el('circle',{cx:x,cy:y,r:25,fill:f.mode==='min'?'#2456be':'#7043b5',stroke:f.active.includes(i)?'#f5af16':'white','stroke-width':f.active.includes(i)?5:2});el('text',{x,y:y+5,'text-anchor':'middle',fill:'white','font-size':14},n);el('text',{x,y:y+43,'text-anchor':'middle',fill:'#526477','font-size':12},`index ${i}`);});if(!f.a.length)el('text',{x:width/2,y:105,'text-anchor':'middle',fill:'#526477'},'Heap is empty');$('array').replaceChildren(...f.a.map((n,i)=>{let cell=document.createElement('div');cell.className='cell'+(f.active.includes(i)?' active':'');let value=document.createElement('div');value.textContent=n;let idx=document.createElement('div');idx.className='index';idx.textContent=i;cell.append(value,idx);return cell;}));$('message').textContent=f.message;$('counter').textContent=`Step ${position+1} of ${frames.length}`;$('prev').disabled=position===0;$('next').disabled=position===frames.length-1;$('status').textContent=position===frames.length-1?`\u2713 Final ${f.mode} heap satisfies parent order and complete-tree rules.`:'Intermediate step \u2014 heap order may temporarily be violated.';$('steps').replaceChildren(...frames.map((s,j)=>{let li=document.createElement('li');li.textContent=s.message;li.style.fontWeight=j===position?'700':'400';return li;}));}\nfunction operation(action){frames=[];action();heap.validate();position=frames.length-1;draw();}\nfunction value(){let s=$('value').value.trim(),n=Number(s);if(!s||!Number.isSafeInteger(n)){alert('Enter a safe whole number.');return null;}return n;}\n$('insert').onclick=()=>{let n=value();if(n!==null)operation(()=>heap.insert(n));};$('root').onclick=()=>operation(()=>heap.removeAt(0));$('remove').onclick=()=>{let n=value();if(n!==null)operation(()=>heap.removeValue(n));};$('find').onclick=()=>{let n=value();if(n===null)return;operation(()=>{for(let i=0;i\u003cheap.a.length;i++){heap.snapshot(`Check index ${i}: ${heap.a[i]}.`,[i]);if(heap.a[i]===n){heap.snapshot(`Found ${n} at index ${i}.`,[i]);return;}}heap.snapshot(`${n} is not in the heap.`);});};$('mode').onchange=()=>operation(()=>heap.rebuild($('mode').value));$('example').onclick=()=>operation(()=>{heap=new Heap($('mode').value,f=>frames.push(f));heap.a=[40,20,60,10,30,50,70,25,15];heap.rebuild(heap.mode);heap.snapshot('Example loaded. Try inserting 5 or deleting the root.');});$('reset').onclick=()=>operation(()=>{heap=new Heap($('mode').value,f=>frames.push(f));heap.snapshot('Heap reset.');});$('prev').onclick=()=>{position--;draw();};$('next').onclick=()=>{position++;draw();};$('value').onkeydown=e=>{if(e.key==='Enter')$('insert').click();};heap.snapshot('Choose min or max heap, then enter a value.');draw();\n\u003c/script>\u003c/body>\u003c/html>\n", "radix": "\u003c!DOCTYPE html>\u003chtml lang=\"en\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cstyle>*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#182334;font:16px system-ui}main{max-width:1100px;margin:32px auto;padding:0 20px}p{line-height:1.6}.card{background:white;padding:22px;border-radius:16px;border:1px solid #dbe2ea;margin:18px 0}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input{padding:12px;border:1px solid #aab8ca;border-radius:8px;font:inherit;flex:1;min-width:200px}button{background:#2456be;color:white;border:0;padding:12px 16px;border-radius:8px;font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:default}.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.bucket{padding:12px;border:1px solid #dbe2ea;border-radius:10px;min-height:95px}.chip{display:inline-block;padding:7px 10px;background:#e7edf6;border-radius:6px;margin:4px}.active{background:#fff1b9;outline:2px solid #e59a00}.small{font-size:13px;color:#526477}#error{color:#b6203b}#message{font-weight:600}li{padding:4px}\u003c/style>\u003cmain>\u003ch1>Radix sort \u2014 first two passes\u003c/h1>\u003cp>Pass 0 uses the \u003cb>ones digit\u003c/b> (10\u2070). Pass 1 uses the \u003cb>tens digit\u003c/b> (10\u00b9). Read each pass from left to right, using the previous pass\u2019s output.\u003c/p>\u003csection class=\"card\">\u003clabel for=\"values\">Non-negative whole numbers, separated by commas or spaces\u003c/label>\u003cdiv class=\"controls\">\u003cinput id=\"values\" value=\"170, 45, 75, 90, 802, 24, 2, 66\">\u003cbutton id=\"start\">Start / reset\u003c/button>\u003c/div>\u003cp id=\"error\" role=\"alert\">\u003c/p>\u003c/section>\u003csection class=\"card\">\u003cdiv class=\"controls\">\u003cbutton id=\"prev\">\u2190 Previous\u003c/button>\u003cbutton id=\"next\">Next \u2192\u003c/button>\u003cspan id=\"counter\">\u003c/span>\u003c/div>\u003cp id=\"message\" aria-live=\"polite\">\u003c/p>\u003ch3>Input for this pass\u003c/h3>\u003cdiv id=\"input\">\u003c/div>\u003ch3>Buckets 0\u20139\u003c/h3>\u003cdiv id=\"buckets\" class=\"buckets\">\u003c/div>\u003ch3>Collected output\u003c/h3>\u003cdiv id=\"output\">\u003c/div>\u003cp id=\"notice\">\u003c/p>\u003c/section>\u003csection class=\"card\">\u003ch2>Remember\u003c/h2>\u003cul>\u003cli>Put values into buckets in their current array order.\u003c/li>\u003cli>Collect buckets from 0 to 9, keeping their internal order.\u003c/li>\u003cli>The tens pass uses the collected output of the ones pass.\u003c/li>\u003cli>Missing digits are zero: 7 has tens digit 0.\u003c/li>\u003cli>After two passes, values are ordered by their last two digits. Numbers above 99 may need more passes for a full sort.\u003c/li>\u003c/ul>\u003c/section>\u003c/main>\u003cscript>\n'use strict';\nfunction radixFrames(values){let frames=[],current=values.slice();for(let pass=0;pass\u003c2;pass++){let buckets=Array.from({length:10},()=>[]),output=[];const push=(message,active=-1)=>frames.push({pass,message,input:current.slice(),active,buckets:buckets.map(b=>b.slice()),output:output.slice()});push(`Pass ${pass}: distribute by the ${pass===0?'ones':'tens'} digit.`);current.forEach((v,i)=>{let d=Math.floor(v/10**pass)%10;buckets[d].push(v);push(`${v}: ${pass===0?'ones':'tens'} digit is ${d}. Append to bucket ${d}.`,i);});for(let d=0;d\u003c10;d++){output.push(...buckets[d]);push(`Collect bucket ${d} in insertion order.`);}push(`Pass ${pass} complete.${pass===0?' Use this output as the next pass\u2019s input.':' Stop after the tens pass.'}`);current=output.slice();}return frames;}\nconst $=id=>document.getElementById(id);let frames=[],pos=0;function chips(target,values,active=-1){$(target).replaceChildren(...values.map((v,i)=>{let e=document.createElement('span');e.className='chip'+(i===active?' active':'');e.textContent=v;return e;}));}function draw(){let f=frames[pos];chips('input',f.input,f.active);chips('output',f.output);$('buckets').replaceChildren(...f.buckets.map((b,i)=>{let e=document.createElement('div');e.className='bucket';let t=document.createElement('b');t.textContent='Bucket '+i;e.append(t,document.createElement('br'));for(let v of b){let c=document.createElement('span');c.className='chip';c.textContent=v;e.append(c);}return e;}));$('message').textContent=f.message;$('counter').textContent=`Pass ${f.pass} \u00b7 Step ${pos+1} of ${frames.length}`;$('prev').disabled=pos===0;$('next').disabled=pos===frames.length-1;$('notice').textContent=pos===frames.length-1?'Two passes complete. '+(f.output.every((v,i,a)=>i===0||a[i-1]\u003c=v)?'This array is also fully sorted.':'This array is not fully sorted; higher digits need more passes.'):'Buckets preserve the order in which values arrive.';}\nfunction start(){let tokens=$('values').value.trim().split(/[\\s,]+/),a=tokens.map(Number);if(!$('values').value.trim()||tokens.some(t=>!/^\\d+$/.test(t))||a.some(v=>!Number.isSafeInteger(v)||v\u003c0)||a.length>60){$('error').textContent='Enter 1\u201360 non-negative safe whole numbers.';return;}$('error').textContent='';frames=radixFrames(a);pos=0;draw();}$('start').onclick=start;$('prev').onclick=()=>{pos--;draw();};$('next').onclick=()=>{pos++;draw();};start();\n\u003c/script>\u003c/html>", "bucket": "\u003c!DOCTYPE html>\u003chtml lang=\"en\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cstyle>*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#182334;font:16px system-ui}main{max-width:1100px;margin:32px auto;padding:0 20px}p{line-height:1.6}.card{background:white;padding:22px;border-radius:16px;border:1px solid #dbe2ea;margin:18px 0}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input{padding:12px;border:1px solid #aab8ca;border-radius:8px;font:inherit;flex:1;min-width:200px}button{background:#2456be;color:white;border:0;padding:12px 16px;border-radius:8px;font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:default}.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.bucket{padding:12px;border:1px solid #dbe2ea;border-radius:10px;min-height:95px}.chip{display:inline-block;padding:7px 10px;background:#e7edf6;border-radius:6px;margin:4px}.active{background:#fff1b9;outline:2px solid #e59a00}.small{font-size:13px;color:#526477}#error{color:#b6203b}#message{font-weight:600}li{padding:4px}\u003c/style>\u003cmain>\u003ch1>Bucket sort \u2014 ranges\u003c/h1>\u003cp>This version uses values from 0 to 99 and ten range buckets. Distribute the values, sort inside each bucket using insertion sort, then collect the buckets from left to right.\u003c/p>\u003csection class=\"card\">\u003clabel for=\"values\">Whole numbers from 0 to 99\u003c/label>\u003cdiv class=\"controls\">\u003cinput id=\"values\" value=\"29, 10, 14, 37, 13, 88, 2, 45, 21, 99\">\u003cbutton id=\"start\">Start / reset\u003c/button>\u003c/div>\u003cp id=\"error\" role=\"alert\">\u003c/p>\u003c/section>\u003csection class=\"card\">\u003cdiv class=\"controls\">\u003cbutton id=\"prev\">\u2190 Previous\u003c/button>\u003cbutton id=\"next\">Next \u2192\u003c/button>\u003cspan id=\"counter\">\u003c/span>\u003c/div>\u003cp id=\"message\" aria-live=\"polite\">\u003c/p>\u003ch3>Original array\u003c/h3>\u003cdiv id=\"input\">\u003c/div>\u003ch3>Range buckets\u003c/h3>\u003cdiv class=\"buckets\" id=\"buckets\">\u003c/div>\u003ch3>Collected output\u003c/h3>\u003cdiv id=\"output\">\u003c/div>\u003c/section>\u003csection class=\"card\">\u003ch2>Bucket sort vs radix sort\u003c/h2>\u003cp>Here, bucket sort groups by \u003cb>value range\u003c/b>: bucket 2 holds 20\u201329. It sorts within each bucket before collecting. Radix sort groups by \u003cb>one digit per pass\u003c/b> and preserves arrival order within every bucket.\u003c/p>\u003cp>With insertion sort inside buckets, worst-case time is O(n\u00b2). Expected O(n + k) performance needs a suitable input distribution and bucket count; k is the number of buckets. Recording and displaying these steps adds work.\u003c/p>\u003c/section>\u003c/main>\u003cscript>\n'use strict';\nfunction bucketFrames(values){let frames=[],buckets=Array.from({length:10},()=>[]),output=[];const push=(message,active=-1,bucket=-1)=>frames.push({message,input:values.slice(),active,bucket,buckets:buckets.map(b=>b.slice()),output:output.slice()});push('Distribute values into range buckets.');values.forEach((v,i)=>{let b=Math.floor(v/10);buckets[b].push(v);push(`Put ${v} into bucket ${b}: ${b*10}\u2013${b*10+9}.`,i,b);});for(let b=0;b\u003c10;b++){let a=buckets[b];push(`Sort bucket ${b} (${b*10}\u2013${b*10+9}) using insertion sort.`, -1,b);for(let i=1;i\u003ca.length;i++){let j=i;while(j>0&&a[j]\u003ca[j-1]){let x=a[j],y=a[j-1];[a[j],a[j-1]]=[a[j-1],a[j]];push(`Bucket ${b}: swap ${x} and ${y}.`,-1,b);j--;}}push(`Bucket ${b} is sorted.`,-1,b);}for(let b=0;b\u003c10;b++){output.push(...buckets[b]);push(`Collect sorted bucket ${b}.`,-1,b);}push('Bucket sort complete. The output is fully sorted.');return frames;}\nconst $=id=>document.getElementById(id);let frames=[],pos=0;function chips(target,values,active=-1){$(target).replaceChildren(...values.map((v,i)=>{let e=document.createElement('span');e.className='chip'+(i===active?' active':'');e.textContent=v;return e;}));}function draw(){let f=frames[pos];chips('input',f.input,f.active);chips('output',f.output);$('buckets').replaceChildren(...f.buckets.map((b,i)=>{let e=document.createElement('div');e.className='bucket'+(i===f.bucket?' active':'');let t=document.createElement('b');t.textContent=`${i*10}\u2013${i*10+9}`;e.append(t,document.createElement('br'));for(let v of b){let c=document.createElement('span');c.className='chip';c.textContent=v;e.append(c);}return e;}));$('message').textContent=f.message;$('counter').textContent=`Step ${pos+1} of ${frames.length}`;$('prev').disabled=pos===0;$('next').disabled=pos===frames.length-1;}\nfunction start(){let tokens=$('values').value.trim().split(/[\\s,]+/),a=tokens.map(Number);if(!$('values').value.trim()||tokens.some(t=>!/^\\d+$/.test(t))||a.some(v=>!Number.isInteger(v)||v\u003c0||v>99)||a.length>60){$('error').textContent='Enter 1\u201360 whole numbers between 0 and 99.';return;}$('error').textContent='';frames=bucketFrames(a);pos=0;draw();}$('start').onclick=start;$('prev').onclick=()=>{pos--;draw();};$('next').onclick=()=>{pos++;draw();};start();\n\u003c/script>\u003c/html>", "asymptotic": "\u003c!DOCTYPE html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Asymptotic Analysis Lab\u003c/title>\u003cstyle>\n*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#182334;font:16px system-ui}main{max-width:1100px;margin:30px auto;padding:0 20px}.card{background:white;padding:22px;margin:18px 0;border:1px solid #dbe2ea;border-radius:16px}p,li{line-height:1.6}textarea{width:100%;padding:14px;min-height:150px;font:17px monospace;border:1px solid #aab8ca;border-radius:10px}button{padding:12px 18px;background:#2456be;color:white;border:0;border-radius:8px;font:inherit;cursor:pointer;margin:8px 8px 0 0}.scroll{overflow:auto}table{border-collapse:collapse;width:100%}th,td{padding:14px;text-align:left;border-bottom:1px solid #dbe2ea;vertical-align:top}.answer{font-size:23px;font-weight:700;color:#2456be}.error{color:#b6203b}.small{color:#526477;font-size:14px}code{background:#eef2f6;padding:3px 6px}summary{cursor:pointer}.note{background:#fff7dd;padding:12px;border-radius:8px}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003ch1>Asymptotic Analysis\u003c/h1>\u003cp>Enter several functions or recurrences, \u003cb>one per line\u003c/b>. Get clear Big O, Omega and Theta answers, with the reasoning for each.\u003c/p>\u003csection class=\"card\">\u003clabel for=\"expressions\">Functions / recurrences\u003c/label>\u003ctextarea id=\"expressions\" spellcheck=\"false\">1000n^0.5 + 2log(n)\nT(n) = 2T(n/4) + 3n^2\n5/n^3 + 2sqrt(n^2)\u003c/textarea>\u003cbutton id=\"analyse\">Analyse all\u003c/button>\u003cbutton id=\"examples\">Load screenshot examples\u003c/button>\u003cp class=\"small\">Examples: n/2, (n^2+n)/n, n/log(n), 2^n, n!, T(n)=2T(n/2)+n. Use parentheses for fractions and powers such as n^(1/2). Typing n\u00b2, \u221a(n), and implicit multiplication such as 3n\u00b2 is supported.\u003c/p>\u003c/section>\u003csection class=\"card\">\u003ch2>Answers\u003c/h2>\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Function\u003c/th>\u003cth>Big O\u003c/th>\u003cth>Omega\u003c/th>\u003cth>Theta\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"answers\">\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv id=\"details\">\u003c/div>\u003c/section>\u003cdetails class=\"card\">\u003csummary>Supported cases and assumptions\u003c/summary>\u003cp>Positive sums, products and quotients of constants, powers of n, log(n), sqrt(...), n!, and positive constant-base exponentials such as 2^n. Subtraction and cancellation are rejected.\u003c/p>\u003cp>Recurrences must have the form T(n)=aT(n/b)+f(n), with an integer a \u2265 1 and b > 1. This page solves polynomial/logarithmic f(n) using the extended Master Theorem, assuming a positive constant base-case cost and standard rounding of subproblem sizes. Other recurrence forms are rejected.\u003c/p>\u003cp>The results concern n \u2192 \u221e. O is an upper bound, \u03a9 a lower bound, and \u0398 a tight bound. They do not automatically mean worst, best, and average case.\u003c/p>\u003cp>All three columns show the tight growth form. Broader O or \u03a9 bounds may also be valid. Unsupported expressions give an error rather than a guessed answer.\u003c/p>\u003c/details>\u003c/main>\u003cscript>\n'use strict';\n// Growth: (n!)^h * exp(e*n) * n^p * (log n)^q * (log log n)^r.\nconst G=(h=0,e=0,p=0,q=0,r=0)=>({h,e,p,q,r});\nconst keys=['h','e','p','q','r'];\nfunction cmp(a,b){for(const k of keys){if(a[k]>b[k])return 1;if(a[k]\u003cb[k])return -1;}return 0;}\nfunction combine(a,b,sign=1){return G(...keys.map(k=>a[k]+sign*b[k]));}\nfunction pow(a,x){return G(...keys.map(k=>a[k]*x));}\nfunction normalize(s){return s.replace(/[\u2212\u2013]/g,'-').replace(/[\u00d7\u00b7]/g,'*').replace(/\u00f7/g,'/').replace(/\u221a/g,'sqrt').replace(/[\u2070\u00b9\u00b2\u00b3\u2074\u2075\u2076\u2077\u2078\u2079]+/g,m=>'^'+[...m].map(c=>'\u2070\u00b9\u00b2\u00b3\u2074\u2075\u2076\u2077\u2078\u2079'.indexOf(c)).join('')).replace(/\\*\\*/g,'^').trim();}\nfunction parse(source){let tokens=[],s=normalize(source),i=0;while(i\u003cs.length){if(/\\s/.test(s[i])){i++;continue;}let m=/^(?:\\d+(?:\\.\\d+)?|\\.\\d+)/.exec(s.slice(i));if(m){tokens.push(m[0]);i+=m[0].length;continue;}m=/^(?:sqrt|log|ln|n)/.exec(s.slice(i));if(m){tokens.push(m[0]);i+=m[0].length;continue;}if('()+*/^-!'.includes(s[i])){tokens.push(s[i++]);continue;}throw Error('Unsupported input near '+s.slice(i)+'.');}if(!tokens.length)throw Error('Enter a function.');let j=0;const peek=()=>tokens[j],take=()=>tokens[j++],expect=t=>{if(take()!==t)throw Error('Expected '+t+'.');},num=t=>/^(?:\\d+(?:\\.\\d+)?|\\.\\d+)$/.test(t??'');\n function exponent(){let bracket=peek()==='(';if(bracket)take();let sign=1;if(peek()==='-'){take();sign=-1;}let t=take();if(!num(t))throw Error('Use a numeric exponent, e.g. n^2 or n^(1/2).');let x=Number(t);if(bracket&&peek()==='/'){take();let d=take();if(!num(d)||Number(d)===0)throw Error('Invalid exponent denominator.');x/=Number(d);}if(bracket)expect(')');return sign*x;}\n function atom(){let t=take();if(t==='('){let v=sum();expect(')');return v;}if(t==='n'){if(peek()==='!'){take();return G(1);}return G(0,0,1);}if(t==='sqrt'){expect('(');let v=sum();expect(')');return pow(v,.5);}if(t==='log'||t==='ln'){expect('(');expect('n');expect(')');return G(0,0,0,1);}if(num(t)){let v=Number(t);if(!(v>0)&&v!==0)throw Error('Invalid constant.');if(v===0)throw Error('Use positive constants; zero terms are not supported.');if(peek()==='^'&&tokens[j+1]==='n'){take();take();return G(0,Math.log(v));}return G();}throw Error('Unsupported term '+(t??'(missing)')+'.');}\n function powered(){let v=atom();if(peek()==='^'){take();v=pow(v,exponent());}return v;}\n function product(){let v=powered();while(peek()==='*'||peek()==='/'||peek()==='n'||peek()==='sqrt'||peek()==='log'||peek()==='ln'||peek()==='('||num(peek())){let sign=1;if(peek()==='*'||peek()==='/')sign=take()==='/'?-1:1;v=combine(v,powered(),sign);}return v;}\n function sum(){let v=product();while(peek()==='+'){take();let b=product();if(cmp(b,v)>0)v=b;}return v;}\n let v=sum();if(j!==tokens.length)throw Error('Subtraction, cancellation, and this syntax are not supported.');if(!keys.every(k=>Number.isFinite(v[k])))throw Error('Expression is outside the supported range.');return v;}\nfunction numText(x){return Number(x.toPrecision(10)).toString();}\nfunction format(g){let factors=[];if(g.h)factors.push(g.h===1?'n!':`(n!)^(${numText(g.h)})`);if(g.e){let b=Math.exp(g.e);factors.push(Number.isFinite(b)&&b>0?`${numText(b)}^n`:`exp(${numText(g.e)}n)`);}if(g.p)factors.push(g.p===.5?'\u221an':g.p===1?'n':g.p===2?'n\u00b2':g.p===3?'n\u00b3':`n^(${numText(g.p)})`);if(g.q)factors.push(g.q===1?'log n':`(log n)^(${numText(g.q)})`);if(g.r)factors.push(g.r===1?'log log n':`(log log n)^(${numText(g.r)})`);return factors.join(' \u00b7 ')||'1';}\nfunction solve(input){let s=normalize(input),m=/^(?:T\\s*\\(\\s*n\\s*\\)\\s*=\\s*)?(\\d+(?:\\.\\d+)?\\s*\\*?\\s*)?T\\s*\\(\\s*n\\s*\\/\\s*(\\d+(?:\\.\\d+)?)\\s*\\)\\s*\\+\\s*(.+)$/i.exec(s);if(m){let a=m[1]?Number(m[1].replace(/[\\s*]/g,'')):1,b=Number(m[2]);if(!Number.isSafeInteger(a)||a\u003c1||b\u003c=1)throw Error('Master Theorem requires integer a \u2265 1 and b > 1.');let f=parse(m[3]);if(f.h||f.e||f.r)throw Error('This recurrence solver requires polynomial/logarithmic f(n).');let c=Math.log(a)/Math.log(b),delta=f.p-c,tolerance=64*Number.EPSILON*Math.max(1,Math.abs(f.p),Math.abs(c)),answer,caseText;if(delta \u003c -tolerance){answer=G(0,0,c);caseText='Case 1: f(n) grows polynomially slower than n^(log_b a). Recursive work dominates.';}else if(delta > tolerance){answer=f;caseText='Case 3: f(n) grows polynomially faster than n^(log_b a). The polynomial/logarithmic form satisfies the regularity condition; work outside recursion dominates.';}else if(f.q>-1){answer=G(0,0,c,f.q+1);caseText='Equal polynomial powers: add one to the logarithm exponent.';}else if(f.q===-1){answer=G(0,0,c,0,1);caseText='Equal polynomial powers with 1/log n: the levels contribute a log log n factor.';}else{answer=G(0,0,c);caseText='Equal polynomial powers with log exponent below \u22121: the logarithmic level sum converges.';}return {g:answer,steps:[`a = ${a}; b = ${b}; f(n) \u2208 \u0398(${format(f)}).`,`log_${b}(${a}) = ${numText(c)}. Compare the power ${numText(f.p)} in f(n) with ${numText(c)}.`,caseText,`Therefore T(n) \u2208 \u0398(${format(answer)}).`]};}\n if(/\\bT\\s*\\(/i.test(s.replace(/^(?:T|f)\\s*\\(\\s*n\\s*\\)\\s*=\\s*/i,'')))throw Error('Use T(n)=aT(n/b)+f(n), e.g. T(n)=2T(n/4)+3n^2.');s=s.replace(/^(?:T|f)\\s*\\(\\s*n\\s*\\)\\s*=\\s*/i,'');let g=parse(s);return {g,steps:['Ignore constant positive factors. In a positive sum, keep the fastest-growing term.','Products combine growth; fractions divide growth. For example, \u221a(n\u00b2) = n because n is positive.',`The tight growth form is ${format(g)}. Thus O(${format(g)}), \u03a9(${format(g)}), and \u0398(${format(g)}) all hold.`]};}\n// UI: every non-empty line is analysed independently.\nconst $=id=>document.getElementById(id);\nfunction analyse(){let lines=$('expressions').value.split('\\n').map(s=>s.trim()).filter(Boolean);$('answers').replaceChildren();$('details').replaceChildren();if(!lines.length){$('details').textContent='Enter at least one function.';return;}if(lines.length>50){$('details').textContent='Please enter at most 50 functions at a time.';return;}lines.forEach((line,index)=>{let row=document.createElement('tr'),cell=document.createElement('td');cell.textContent=line;row.append(cell);try{let result=solve(line),bound=format(result.g);for(let symbol of ['O','\u03a9','\u0398']){let td=document.createElement('td');td.className='answer';td.textContent=`${symbol}(${bound})`;row.append(td);}let detail=document.createElement('details');detail.className='card';let title=document.createElement('summary');title.textContent=`${index+1}. ${line} \u2192 O(${bound})`;detail.append(title);let ol=document.createElement('ol');for(let step of result.steps){let li=document.createElement('li');li.textContent=step;ol.append(li);}detail.append(ol);$('details').append(detail);}catch(e){let td=document.createElement('td');td.colSpan=3;td.className='error';td.textContent=e.message;row.append(td);}$('answers').append(row);});}\n$('analyse').onclick=analyse;$('examples').onclick=()=>{$('expressions').value='1000n^0.5 + 2log(n)\\nT(n) = 2T(n/4) + 3n^2\\n5/n^3 + 2sqrt(n^2)';analyse();};analyse();\n\u003c/script>\u003c/body>\u003c/html>\n"};const frames={};function route(){let key=location.hash.slice(1);if(!Object.hasOwn(sources,key))key='red-black';if(!frames[key]){let f=document.createElement('iframe');f.title=({'red-black':'Red-black tree',heaps:'Min and max heaps',radix:'Radix sort',bucket:'Bucket sort',asymptotic:'Asymptotic analysis',asymptotic:'Asymptotic analysis'})[key];f.srcdoc=sources[key];document.getElementById('pages').append(f);frames[key]=f;}for(let [k,f]of Object.entries(frames))f.hidden=k!==key;for(let a of document.querySelectorAll('nav a')){if(a.hash==='#'+key)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');}}window.addEventListener('hashchange',route);route();
</script><script src="./js/huffman.js"></script></body></html>
