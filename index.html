<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Red–Black Tree Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#182334;font:16px system-ui,sans-serif}main{max-width:1150px;margin:36px auto;padding:0 20px}h1{margin-bottom:6px}p{line-height:1.6}.card{background:white;border:1px solid #dbe2ea;border-radius:16px;padding:20px;margin:18px 0}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input{padding:11px;width:150px;border:1px solid #aab8ca;border-radius:8px}button{padding:11px 16px;border:0;border-radius:8px;background:#2456be;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:default}.secondary{background:#e7edf6;color:#182334}#canvas{overflow:auto}svg{display:block;min-width:100%;height:auto}#message{min-height:28px;font-weight:600}li{padding:5px}label{display:flex;align-items:center;gap:8px}label input{width:auto}.muted{color:#526477;font-size:14px}#steps{max-height:280px;overflow:auto}#status{color:#247447}a{color:#2456be}code{background:#eef2f6;padding:2px 5px}
@media(max-width:600px){main{margin:20px auto;padding:0 12px}.card{padding:14px;margin:12px 0}.controls{gap:8px}.card.controls>input{flex:1 1 120px;min-width:0}.card.controls>button{flex:1 1 calc(50% - 8px);padding:10px 8px}.card:not(.controls)>.controls>button{flex:1 1 130px;padding:10px 8px}.card:not(.controls)>.controls>label{flex:1 1 100%}h1{font-size:1.7rem}#message{overflow-wrap:anywhere}#canvas svg{width:100%!important;min-width:0}}
</style></head><body><main>
<h1>Red–Black Trees</h1><p>Insert, delete, and find values. Review each rotation and recolouring with the step buttons.</p>
<section class="card controls"><label for="value">Value</label><input id="value" type="number" step="1" placeholder="e.g. 25"><button id="insert">Insert</button><button id="remove">Delete</button><button id="find">Find</button><button id="print" class="secondary">Print sorted</button><button id="example" class="secondary">Load example</button><button id="reset" class="secondary">Reset</button></section>
<section class="card"><div class="controls"><button id="prev" class="secondary">← Previous step</button><button id="next" class="secondary">Next step →</button><span id="counter"></span><label><input id="nil" type="checkbox">Show NIL leaves</label></div><p id="message" aria-live="polite"></p><div id="canvas"><svg id="tree" role="img" aria-label="Red-black tree"></svg></div><ol id="steps"></ol><p id="status"></p><p id="sorted" class="muted"></p></section>
</main><script>
'use strict';
// One shared black sentinel represents all missing children.
class RBTree {
 constructor(record=()=>{}){this.nil={color:'B',key:null};this.nil.left=this.nil.right=this.nil.parent=this.nil;this.root=this.nil;this.record=record;}
 snapshot(message,highlight=null){const copy=n=>n===this.nil?null:{key:n.key,color:n.color,left:copy(n.left),right:copy(n.right)};this.record({message,highlight,root:copy(this.root)});}
 find(key){let n=this.root;while(n!==this.nil&&n.key!==key)n=key<n.key?n.left:n.right;return n;}
 leftRotate(x){let y=x.right;x.right=y.left;if(y.left!==this.nil)y.left.parent=x;y.parent=x.parent;if(x.parent===this.nil)this.root=y;else if(x===x.parent.left)x.parent.left=y;else x.parent.right=y;y.left=x;x.parent=y;this.snapshot(`Rotate left at ${x.key}.`);}
 rightRotate(x){let y=x.left;x.left=y.right;if(y.right!==this.nil)y.right.parent=x;y.parent=x.parent;if(x.parent===this.nil)this.root=y;else if(x===x.parent.right)x.parent.right=y;else x.parent.left=y;y.right=x;x.parent=y;this.snapshot(`Rotate right at ${x.key}.`);}
 insert(key){if(this.find(key)!==this.nil){this.snapshot(`${key} already exists; duplicates are ignored.`,key);return;}let p=this.nil,n=this.root;while(n!==this.nil){p=n;n=key<n.key?n.left:n.right;}let z={key,color:'R',left:this.nil,right:this.nil,parent:p};if(p===this.nil)this.root=z;else if(key<p.key)p.left=z;else p.right=z;this.snapshot(`Insert ${key} as a red leaf.`,key);
 while(z.parent.color==='R'){let p=z.parent,g=p.parent;let left=p===g.left,u=left?g.right:g.left;if(u.color==='R'){p.color=u.color='B';g.color='R';this.snapshot(`Red uncle: colour parent ${p.key} and uncle ${u.key} black; grandparent ${g.key} red.`);z=g;}else{if(z===(left?p.right:p.left)){z=p;left?this.leftRotate(z):this.rightRotate(z);}z.parent.color='B';z.parent.parent.color='R';this.snapshot('Black uncle: colour parent black and grandparent red.');left?this.rightRotate(z.parent.parent):this.leftRotate(z.parent.parent);}}
 this.root.color='B';this.snapshot(`Insertion complete. Root is black.`,key);}
 transplant(u,v){if(u.parent===this.nil)this.root=v;else if(u===u.parent.left)u.parent.left=v;else u.parent.right=v;v.parent=u.parent;}
 remove(key){let z=this.find(key);if(z===this.nil){this.snapshot(`${key} is not in the tree.`);return;}let y=z,old=y.color,x;if(z.left===this.nil){x=z.right;this.transplant(z,z.right);}else if(z.right===this.nil){x=z.left;this.transplant(z,z.left);}else{y=z.right;while(y.left!==this.nil)y=y.left;old=y.color;x=y.right;if(y.parent===z)x.parent=y;else{this.transplant(y,y.right);y.right=z.right;y.right.parent=y;}this.transplant(z,y);y.left=z.left;y.left.parent=y;y.color=z.color;}
 this.snapshot(`Remove ${key}${y!==z?`; replace it with successor ${y.key}`:''}.`);if(old==='B')this.fixDelete(x);this.nil.color='B';if(this.root!==this.nil)this.root.parent=this.nil;this.snapshot(`Deletion complete.`,null);}
 fixDelete(x){while(x!==this.root&&x.color==='B'){let left=x===x.parent.left,w=left?x.parent.right:x.parent.left;if(w.color==='R'){w.color='B';x.parent.color='R';this.snapshot('Red sibling: recolour sibling black and parent red.');left?this.leftRotate(x.parent):this.rightRotate(x.parent);w=left?x.parent.right:x.parent.left;}let near=left?w.left:w.right,far=left?w.right:w.left;if(near.color==='B'&&far.color==='B'){if(w!==this.nil)w.color='R';this.snapshot('Black sibling with two black children: recolour sibling red and move the extra black upward.');x=x.parent;}else{if(far.color==='B'){near.color='B';w.color='R';this.snapshot('Near child red, far child black: recolour and rotate sibling.');left?this.rightRotate(w):this.leftRotate(w);w=left?x.parent.right:x.parent.left;}w.color=x.parent.color;x.parent.color='B';(left?w.right:w.left).color='B';this.snapshot('Far child red: transfer parent colour to sibling; colour parent and far child black.');left?this.leftRotate(x.parent):this.rightRotate(x.parent);x=this.root;}}
 x.color='B';}
 values(){let result=[];const walk=n=>{if(n===this.nil)return;walk(n.left);result.push(n.key);walk(n.right);};walk(this.root);return result;}
 validate(){if(this.nil.color!=='B'||this.root.color!=='B')throw Error('Root or NIL is red');const walk=(n,lo,hi)=>{if(n===this.nil)return 1;if(!(n.key>lo&&n.key<hi))throw Error('BST order');if(n.color==='R'&&(n.left.color==='R'||n.right.color==='R'))throw Error('Red violation');if(n.left!==this.nil&&n.left.parent!==n||n.right!==this.nil&&n.right.parent!==n)throw Error('Parent link');let l=walk(n.left,lo,n.key),r=walk(n.right,n.key,hi);if(l!==r)throw Error('Black height');return l+(n.color==='B');};return walk(this.root,-Infinity,Infinity);}
}
const $=id=>document.getElementById(id);let frames=[],position=0;let tree=new RBTree(f=>frames.push(f));
function draw(){const f=frames[position];if(!f)return;const svg=$('tree');svg.replaceChildren();let nodes=[],edges=[],i=0,maxDepth=0;const layout=(n,depth)=>{if(!n&&!$('nil').checked)return null;let left=n?layout(n.left,depth+1):null;let item={n,x:55+85*i++,y:50+90*depth};nodes.push(item);maxDepth=Math.max(maxDepth,depth);let right=n?layout(n.right,depth+1):null;for(let c of [left,right])if(c)edges.push([item,c]);return item;};layout(f.root,0);let width=Math.max(700,i*85+30),height=Math.max(240,maxDepth*90+105);svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.style.width=width+'px';const el=(tag,attrs,text)=>{let e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(let [k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;};for(let [a,b]of edges)el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#9baac0','stroke-width':2});for(let {n,x,y}of nodes){el('circle',{cx:x,cy:y,r:n?25:15,fill:n?.color==='R'?'#c82d46':'#202c3f',stroke:n&&n.key===f.highlight?'#f5af16':'white','stroke-width':n&&n.key===f.highlight?5:2});el('text',{x,y:y+5,'text-anchor':'middle',fill:'white','font-size':n?14:10},n?n.key:'NIL');if(n)el('text',{x,y:y+43,'text-anchor':'middle',fill:'#526477','font-size':12},n.color);}
 if(!f.root&&!$('nil').checked)el('text',{x:350,y:110,'text-anchor':'middle',fill:'#526477'},'Tree is empty');$('message').textContent=f.message;$('counter').textContent=`Step ${position+1} of ${frames.length}`;$('prev').disabled=position===0;$('next').disabled=position===frames.length-1;$('status').textContent=position===frames.length-1?'✓ Final tree satisfies all red–black rules.':'Intermediate repair step — rules may temporarily be violated.';$('steps').replaceChildren(...frames.map((s,j)=>{let li=document.createElement('li');li.textContent=s.message;li.style.fontWeight=j===position?'700':'400';return li;}));}
function operation(action){frames=[];$('sorted').textContent='';action();tree.validate();position=frames.length-1;draw();}
function value(){let s=$('value').value.trim(),n=Number(s);if(!s||!Number.isSafeInteger(n)){alert('Enter a safe whole number.');return null;}return n;}
$('insert').onclick=()=>{let n=value();if(n!==null){operation(()=>tree.insert(n));$('value').value='';$('value').focus();}};$('remove').onclick=()=>{let n=value();if(n!==null)operation(()=>tree.remove(n));};$('find').onclick=()=>{let key=value();if(key===null)return;operation(()=>{let n=tree.root;while(n!==tree.nil){tree.snapshot(`Compare ${key} with ${n.key}.`,n.key);if(key===n.key){tree.snapshot(`Found ${key}.`,key);return;}n=key<n.key?n.left:n.right;}tree.snapshot(`${key} is not in the tree.`);});};$('print').onclick=()=>{$('sorted').textContent='Sorted values: '+(tree.values().join(', ')||'(empty)');};$('reset').onclick=()=>operation(()=>{tree=new RBTree(f=>frames.push(f));tree.snapshot('Tree reset.');});$('example').onclick=()=>operation(()=>{tree=new RBTree(f=>frames.push(f));for(let n of [40,20,60,10,30,50,70,25])tree.insert(n);tree.snapshot('Example loaded. Try inserting 27 or deleting 20.');});$('prev').onclick=()=>{position--;draw();};$('next').onclick=()=>{position++;draw();};$('nil').onchange=draw;$('value').onkeydown=e=>{if(e.key==='Enter')$('insert').click();};tree.snapshot('Enter a number to begin.');draw();
</script></body></html>
